function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtDateShort(iso){ if(!iso) return '—'; const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' }); }
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 2600); }

async function sbPull(){

async function sbPush(){
  try{
    const res = await fetch(SB_URL + '/rest/v1/app_records', { method: 'POST', headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' }, body: JSON.stringify({ id: ROW_ID, app: 'keys', data: S }) });
    if(!res.ok) throw new Error('push ' + res.status);
    syncBadge('● Live sync', true);
  }catch(e){ syncBadge('⚠ Offline — saved on this device', false); }
}
function save(){
  S._ts = Date.now();
  try{ localStorage.setItem('keys-cache', JSON.stringify(S)); }catch(e){}
  syncBadge('Saving…', true);
  clearTimeout(pushTimer); pushTimer = setTimeout(sbPush, 700);

async function pollStamp(){
  if(!S || !me) return;
  try{
    const res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.' + ROW_ID + '&select=data->_ts', { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }, cache: 'no-store' });
    if(!res.ok) return;
    const rows = await res.json();
    const ts = rows && rows[0] && (rows[0]._ts != null ? rows[0]._ts : (rows[0].data && rows[0].data._ts));
    if(ts == null || Number(ts) === Number(S._ts)) return;
    const ae = document.activeElement;
    if(view.name === 'walk' || (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA'))){ pullPending = true; return; }
    const fresh = await sbPull();
    if(fresh && Array.isArray(fresh.points)){ S = fresh; render(); }
  }catch(e){}
}

function pointsOf(prop){ return S.points.filter(p => p.prop === prop); }
function walksOf(prop){ return S.walks.filter(w => w.prop === prop).slice().sort((a, b) => (b.startedTs || 0) - (a.startedTs || 0)); }
function walkById(id){ return S.walks.find(w => w.uid === id); }
function pointById(id){ return S.points.find(p => p.uid === id); }
function walkCounts(w){
  const pts = pointsOf(w.prop);
  let checked = 0, ok = 0, bad = 0;
  pts.forEach(p => { const r = w.results[p.uid]; if(r && r.r){ checked++; if(r.r === 'Working') ok++; else bad++; } });
  return { total: pts.length, checked: checked, ok: ok, bad: bad };
}
function latestStatus(pointUid){
  const ws = S.walks.slice().sort((a, b) => (b.startedTs || 0) - (a.startedTs || 0));
  for(const w of ws){ const r = w.results[pointUid]; if(r && r.r) return { r: r.r, note: r.note || '', walk: w }; }
  return null;
}
function nextWalkNo(prop, dateStr){
  const n = S.walks.filter(w => w.prop === prop && w.date === dateStr).length + 1;
  return 'KEYS-' + prop + '-' + dateStr.replace(/-/g, '') + '-' + String(n).padStart(4, '0');
}

<script>
function pillFor(r){ if(r === 'Working') return '<span class="pill pill-ok">WORKING</span>'; if(r === 'Not Working') return '<span class="pill pill-bad">NOT WORKING</span>'; return '<span class="pill pill-none">NOT CHECKED</span>'; }
function setView(v){ view = v; if(pullPending){ pullPending = false; pollStamp(); } render(); window.scrollTo(0, 0); }

function render(){
  const who = document.getElementById('whoBox');
  who.innerHTML = me ? esc(me) + '<br><button class="btn btn-ghost btn-sm" style="margin-top:4px" onclick="refreshNow()">↻ Refresh</button>' : '';

  if(!S){ main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(!me){ main.innerHTML = lockedOrLogin(); return; }
  if(view.name === 'prop') main.innerHTML = propView(view.prop);
  else if(view.name === 'walk') main.innerHTML = walkView(view.uid);
  else if(view.name === 'report') main.innerHTML = reportView(view.uid);
  else main.innerHTML = homeView();
}
async function refreshNow(){ try{ const f = await sbPull(); if(f && Array.isArray(f.points)){ S = f; } }catch(e){} render(); toast('Refreshed'); }

function homeView(){
  const open = S.walks.filter(w => !w.done);
  const doneCount = S.walks.filter(w => w.done).length;
  const totalPts = S.points.length;
  const downList = [];
  S.points.forEach(p => { const ls = latestStatus(p.uid); if(ls && ls.r === 'Not Working') downList.push({ p: p, ls: ls }); });
  let h = '<div class="card"><h2>Door locks &amp; keys — investigations</h2>'
    + '<p class="note">' + totalPts + ' checkpoints · ' + doneCount + ' investigation' + (doneCount === 1 ? '' : 's') + ' completed · ' + downList.length + ' point' + (downList.length === 1 ? '' : 's') + ' not working right now</p></div>';
  open.forEach(w => {
    const c = walkCounts(w);
    h += '<div class="card" style="border:2px solid var(--gold)"><h3>▶ Walk in progress — ' + esc(PROP_FULL[w.prop]) + '</h3>'
      + '<p class="note">Started ' + esc(w.start) + ' by ' + esc(w.by) + ' · ' + c.checked + ' of ' + c.total + ' checked</p>'
      + '<button class="btn btn-gold" onclick="setView({name:\'walk\',uid:\'' + w.uid + '\'})">Resume the walk</button></div>';
  });
  if(downList.length){
    h += '<div class="card"><h3>⚠ Not working right now (' + downList.length + ')</h3>';
    downList.slice(0, 12).forEach(x => {
      h += '<div class="prow" onclick="setView({name:\'prop\',prop:\'' + x.p.prop + '\'})"><div><b>' + esc(x.p.name) + '</b><br><span class="note">' + esc(PROP_FULL[x.p.prop]) + ' · last checked ' + fmtDateShort(x.ls.walk.date) + '</span></div>' + pillFor('Not Working') + '</div>';
    });
    if(downList.length > 12) h += '<p class="note">…and ' + (downList.length - 12) + ' more — open the property to see them all.</p>';
    h += '</div>';
  }
  h += '<div class="grid">';
  PROPS.forEach(code => {
    const pts = pointsOf(code);
    const ws = walksOf(code);
    const last = ws.filter(w => w.done)[0];
    const down = pts.filter(p => { const ls = latestStatus(p.uid); return ls && ls.r === 'Not Working'; }).length;
    h += '<div class="pcard" onclick="setView({name:\'prop\',prop:\'' + code + '\'})"><div class="pn">' + esc(PROP_FULL[code]) + '</div>'
      + '<p class="note" style="margin:6px 0">' + pts.length + ' checkpoint' + (pts.length === 1 ? '' : 's') + (last ? ' · Last investigation ' + fmtDateShort(last.date) + ' — ' + walkCounts(last).ok + ' working, ' + walkCounts(last).bad + ' not working' : ' · No investigation yet') + '</p>'
      + (down ? '<span class="pill pill-bad">' + down + ' NOT WORKING</span>' : (pts.length ? '<span class="pill pill-ok">ALL WORKING</span>' : '<span class="pill pill-none">NO CHECKPOINTS YET</span>'))
      + '</div>';
  });
  h += '</div>';
  return h;
}

function propView(code){
  const pts = pointsOf(code);
  const ws = walksOf(code);
  const open = ws.find(w => !w.done);
  const done = ws.filter(w => w.done);
  let h = '<button class="btn btn-ghost btn-sm" onclick="setView({name:\'home\'})">← All properties</button>'
    + '<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><h2 style="font-size:21px">' + esc(PROP_FULL[code]) + '</h2><span class="pill pill-prop">' + code + '</span></div>'
    + '<p class="note">' + pts.length + ' checkpoints · ' + done.length + ' investigation' + (done.length === 1 ? '' : 's') + ' on file</p>'
    + (open
      ? '<button class="btn btn-gold" style="width:100%;padding:14px;font-size:16.5px" onclick="setView({name:\'walk\',uid:\'' + open.uid + '\'})">▶ Resume walk in progress (' + walkCounts(open).checked + ' of ' + pts.length + ' checked)</button>'
      : '<button class="btn btn-navy" style="width:100%;padding:14px;font-size:16.5px" onclick="startWalk(\'' + code + '\')">▶ Start investigation</button>')
    + '</div>';
  h += '<div class="card"><h3>Checkpoints (' + pts.length + ')</h3>';
  if(!pts.length) h += '<div class="empty">No checkpoints yet.<br>Add the doors, gates and key points for this property below — or add them during a walk.</div>';
  pts.forEach(p => {
    const ls = latestStatus(p.uid);
    h += '<div class="prow" onclick="openPoint(\'' + p.uid + '\')"><div><b>' + esc(p.name) + '</b><br><span class="note">' + esc(p.kind) + (ls ? ' · ' + fmtDateShort(ls.walk.date) : '') + '</span></div>' + pillFor(ls ? ls.r : '') + '</div>';
  });
  h += '<label>New checkpoint name</label><input id="np-name" placeholder="e.g. Tower 1 — pool gate 3" autocomplete="off">'
    + '<label>Type</label><select id="np-kind">' + KINDS.map(k => '<option>' + k + '</option>').join('') + '</select>'
    + '<button class="btn btn-navy" style="width:100%;margin-top:12px" onclick="addPoint(\'' + code + '\',\'prop\')">＋ Add checkpoint</button></div>';
  if(done.length){
    h += '<div class="card"><h3>Past investigations</h3>';
    done.forEach(w => {
      const c = walkCounts(w);
      h += '<div class="prow" onclick="setView({name:\'report\',uid:\'' + w.uid + '\'})"><div><b>' + fmtDateShort(w.date) + '</b> <span class="note">' + esc(w.start) + '–' + esc(w.end || '') + ' · by ' + esc(w.by) + '</span><br><span class="note">' + esc(w.no) + '</span></div><span style="text-align:right"><span>' + c.ok + ' ✓ · ' + c.bad + ' ✗</span><br><button class="btn btn-ghost btn-sm" style="margin-top:5px" onclick="event.stopPropagation();printReport(\'' + w.uid + '\')">🖨 Print</button> <button class="btn btn-gold btn-sm" style="margin-top:5px" onclick="event.stopPropagation();emailReport(\'' + w.uid + '\',this)">✉ Email</button></span></div>';
    });
    h += '</div>';
  }
  return h;
}

function walkView(wid){
  const w = walkById(wid);
  if(!w) return '<div class="card"><div class="empty">This walk is gone.</div></div>';
  const pts = pointsOf(w.prop);
  const c = walkCounts(w);
  let h = '<button class="btn btn-ghost btn-sm" onclick="setView({name:\'prop\',prop:\'' + w.prop + '\'})">← ' + esc(PROP_FULL[w.prop]) + '</button>'
    + '<div class="card" style="margin-top:12px"><h2>Investigation — ' + esc(PROP_FULL[w.prop]) + '</h2>'
    + '<p class="note">' + esc(w.no) + ' · ' + fmtDate(w.date) + ' · started ' + esc(w.start) + ' by ' + esc(w.by) + '<br><b>' + c.checked + ' of ' + c.total + ' checked</b> · ' + c.ok + ' working · ' + c.bad + ' not working</p></div>';
  pts.forEach(p => {
    const r = w.results[p.uid] || {};
    h += '<div class="wrow"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><span class="wn">' + esc(p.name) + '</span>' + pillFor(r.r || '') + '</div>'
      + '<div class="note">' + esc(p.kind) + '</div>'
      + '<div class="mark"><button class="btn ' + (r.r === 'Working' ? 'btn-green on-ok' : '') + '" onclick="markPoint(\'' + w.uid + '\',\'' + p.uid + '\',\'Working\')">✓ Working</button>'
      + '<button class="btn ' + (r.r === 'Not Working' ? 'btn-red on-bad' : '') + '" onclick="markPoint(\'' + w.uid + '\',\'' + p.uid + '\',\'Not Working\')">✗ Not working</button></div>'
      + '<input style="margin-top:8px" placeholder="Note (optional)" value="' + esc(r.note || '') + '" onchange="setNote(\'' + w.uid + '\',\'' + p.uid + '\',this.value)">'
      + '</div>';
  });
  h += '<div class="card"><h3>＋ Add a checkpoint you find on the walk</h3>'
    + '<input id="wp-name" placeholder="Checkpoint name" autocomplete="off">'
    + '<label>Type</label><select id="wp-kind">' + KINDS.map(k => '<option>' + k + '</option>').join('') + '</select>'
    + '<button class="btn btn-navy" style="width:100%;margin-top:12px" onclick="addPoint(\'' + w.prop + '\',\'walk\')">＋ Add checkpoint</button></div>';
  h += '<div style="text-align:center;margin-top:10px"><button class="btn btn-sm" style="color:var(--red)" onclick="discardWalk(\'' + w.uid + '\')">🗑 Discard this walk (nothing filed)</button></div>';
  h += '<div class="stickybar"><button class="btn btn-ghost" style="flex:1" onclick="setView({name:\'prop\',prop:\'' + w.prop + '\'})">Save &amp; exit</button>'
    + '<button class="btn btn-gold" style="flex:2" onclick="finishWalk(\'' + w.uid + '\')">Finish investigation → report</button></div>';
  return h;
}

function openPoint(pid){
  const p = pointById(pid); if(!p) return;
  const ls = latestStatus(pid);
  const sh = document.getElementById('sheet');
  sh.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="font-size:22px;font-weight:800;color:var(--navy2)">🔑 ' + esc(p.name) + '</div><button class="btn btn-ghost btn-sm" onclick="closeSheet()">✕</button></div>'
    + '<div style="margin:8px 0 4px"><span class="pill pill-prop">' + esc(PROP_FULL[p.prop]) + '</span> ' + pillFor(ls ? ls.r : '') + '</div>'
    + '<div class="kv"><span>Type</span><b>' + esc(p.kind) + '</b></div>'
    + '<div class="kv"><span>Last checked</span><b>' + (ls ? fmtDateShort(ls.walk.date) : '—') + '</b></div>'
    + '<div class="kv"><span>Checked by</span><b>' + (ls ? esc(ls.walk.by) : '—') + '</b></div>'
    + '<div class="kv"><span>Result</span><b>' + (ls ? esc(ls.r) : '—') + '</b></div>'
    + '<div class="kv"><span>Notes</span><b>' + (ls && ls.note ? esc(ls.note) : '—') + '</b></div>'
    + '<label style="margin-top:14px">Edit name</label><input id="ep-name" value="' + esc(p.name) + '">'
    + '<label>Edit type</label><select id="ep-kind">' + KINDS.map(k => '<option' + (k === p.kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>'
    + '<button class="btn btn-navy" style="width:100%;margin-top:12px" onclick="editPoint(\'' + p.uid + '\')">Save changes</button>'
    + '<button class="btn" style="width:100%;margin-top:8px;color:var(--red)" onclick="delPoint(\'' + p.uid + '\')">Delete this checkpoint</button>';
  document.getElementById('sheetWrap').style.display = 'block';
}
function closeSheet(){ document.getElementById('sheetWrap').style.display = 'none'; }
document.getElementById('sheetWrap').addEventListener('click', function(e){ if(e.target === this) closeSheet(); });
</script>

<script>
function startWalk(code){
  const open = S.walks.find(w => w.prop === code && !w.done);
  if(open){ setView({ name: 'walk', uid: open.uid }); return; }
  const d = todayStr();
  const w = { uid: uid('walk'), no: nextWalkNo(code, d), prop: code, date: d, start: timeNow(), end: '', startedTs: Date.now(), by: me, done: false, results: {} };
  S.walks.push(w); save();
  setView({ name: 'walk', uid: w.uid });
}
function markPoint(wid, pid, r){
  const w = walkById(wid); if(!w || w.done) return;
  const y = window.scrollY;
  const cur = w.results[pid] || { r: '', note: '' };
  cur.r = (cur.r === r) ? '' : r;
  w.results[pid] = cur;
  save(); render(); window.scrollTo(0, y);
}
function setNote(wid, pid, val){
  const w = walkById(wid); if(!w || w.done) return;
  const cur = w.results[pid] || { r: '', note: '' };
  cur.note = val; w.results[pid] = cur;
  save();
}
function addPoint(code, ctx){
  const nameEl = document.getElementById(ctx === 'walk' ? 'wp-name' : 'np-name');
  const kindEl = document.getElementById(ctx === 'walk' ? 'wp-kind' : 'np-kind');
  const name = (nameEl.value || '').trim();
  if(!name){ toast('Type the checkpoint name first'); nameEl.focus(); return; }
  const y = window.scrollY;
  S.points.push({ uid: uid('pt'), prop: code, name: name, kind: kindEl.value, by: me });
  save(); render(); window.scrollTo(0, y);
  toast('Checkpoint added');
}
function discardWalk(wid){
  const w = walkById(wid); if(!w || w.done) return;
  if(!confirm('Discard this unfinished walk? Nothing will be filed.')) return;
  S.walks = S.walks.filter(x => x.uid !== wid);
  save();
  setView({ name: 'prop', prop: w.prop });
  toast('Walk discarded');
}
function finishWalk(wid){
  const w = walkById(wid); if(!w) return;
  const c = walkCounts(w);
  if(c.checked < c.total && !confirm((c.total - c.checked) + ' checkpoint(s) are not checked yet. Finish the investigation anyway?')) return;
  if(!c.checked && !confirm('Nothing was checked. Finish and file an empty report?')) return;
  w.end = timeNow(); w.done = true;
  save();
  setView({ name: 'report', uid: w.uid });
  toast('Investigation filed');
}
function editPoint(pid){
  const p = pointById(pid); if(!p) return;
  const name = (document.getElementById('ep-name').value || '').trim();
  if(!name){ toast('Name cannot be empty'); return; }
  p.name = name; p.kind = document.getElementById('ep-kind').value;
  save(); closeSheet(); render(); toast('Checkpoint updated');
}
function delPoint(pid){
  const p = pointById(pid); if(!p) return;
  if(!confirm('Delete "' + p.name + '"? It will also be removed from past investigation reports.')) return;
  S.points = S.points.filter(x => x.uid !== pid);
  S.walks.forEach(w => { delete w.results[pid]; });
  save(); closeSheet(); render(); toast('Checkpoint deleted');
}

function reportRows(w){
  return pointsOf(w.prop).map((p, i) => ({ n: i + 1, p: p, r: (w.results[p.uid] || {}).r || '', note: (w.results[p.uid] || {}).note || '' }));
}
function reportView(wid){
  const w = walkById(wid);
  if(!w) return '<div class="card"><div class="empty">Report not found.</div></div>';
  const c = walkCounts(w);
  const rows = reportRows(w);
  const bad = rows.filter(x => x.r === 'Not Working');
  const actions = '<div style="display:flex;gap:8px"><button class="btn btn-navy" style="flex:1;padding:13px;font-size:16px" onclick="printReport(\'' + w.uid + '\')">🖨 Print report</button>'
    + '<button class="btn btn-gold" style="flex:1;padding:13px;font-size:16px" onclick="emailReport(\'' + w.uid + '\',this)">✉ Email report</button></div>';
  let h = '<button class="btn btn-ghost btn-sm" onclick="setView({name:\'prop\',prop:\'' + w.prop + '\'})">← ' + esc(PROP_FULL[w.prop]) + '</button>'
    + '<div class="repbar">' + actions + '</div>'
    + '<div class="card" style="padding:0;overflow:hidden">'
    + '<div style="background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:16px;border-bottom:3px solid var(--gold)">'
    + '<img src="https://jeremylevinatwork-dev.github.io/secure-alert/loews-logo-trim.jpg" alt="Loews Hotels" style="height:34px;width:auto;background:#fff;border-radius:7px;padding:3px 6px">'
    + '<div style="font-size:11px;letter-spacing:2px;color:var(--gold2);font-weight:800;margin-top:10px">LOEWS HOTELS &amp; CO — SECURITY SYSTEMS TECHNOLOGY</div>'
    + '<div style="font-size:22px;font-weight:800;margin-top:3px">🔑 Door Locks &amp; Keys — Investigation Report</div>'
    + '<div style="color:#dbe4f0;font-size:13px;margin-top:3px">Report ' + esc(w.no) + '</div></div>'
    + '<div style="padding:14px">'
    + '<div class="kv"><span>Property</span><b>' + esc(PROP_FULL[w.prop]) + '</b></div>'
    + '<div class="kv"><span>Date</span><b>' + fmtDate(w.date) + '</b></div>'
    + '<div class="kv"><span>Time</span><b>' + esc(w.start) + (w.end ? ' – ' + esc(w.end) : '') + '</b></div>'
    + '<div class="kv"><span>Performed by</span><b>' + esc(w.by) + '</b></div>'
    + '<div class="kv" style="border-bottom:none"><span>Scope</span><b>Physical check of door locks, gates and key points across the property. Each point was tested on site with its key.</b></div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
    + '<div class="stat"><span class="n">' + c.checked + '</span><span class="l">CHECKED</span></div>'
    + '<div class="stat"><span class="n" style="color:var(--green)">' + c.ok + '</span><span class="l">WORKING</span></div>'
    + '<div class="stat"><span class="n" style="color:var(--red)">' + c.bad + '</span><span class="l">NOT WORKING</span></div>'
    + '</div></div></div>';
  h += '<div class="card"><h3>Results — in the order walked</h3>';
  rows.forEach(x => {
    h += '<div class="prow" style="cursor:default"><div><b>' + x.n + '. ' + esc(x.p.name) + '</b>' + (x.note ? '<br><span class="note">' + esc(x.note) + '</span>' : '') + '</div>' + pillFor(x.r) + '</div>';
  });
  h += '</div>';
  if(bad.length){
    h += '<div class="card" style="border-left:5px solid var(--red)"><h3>⚠ Follow-up required — not working (' + bad.length + ')</h3>'
      + bad.map(x => '<div class="prow" style="cursor:default"><div><b>' + esc(x.p.name) + '</b>' + (x.note ? '<br><span class="note">' + esc(x.note) + '</span>' : '') + '</div></div>').join('') + '</div>';
  }
  h += '<div class="card"><h3>Sign-off</h3>'
    + '<div class="kv"><span>Performed by</span><b>' + esc(w.by) + '</b></div>'
    + '<div class="kv"><span>Date</span><b>' + fmtDateShort(w.date) + '</b></div>'
    + '<div class="kv" style="border-bottom:none"><span>Reviewed by</span><b>______________________</b></div></div>'
    + actions
    + '<p class="note" style="text-align:center;margin-top:8px">Email goes to Jeremy Levin. Reports stay on file under the property.</p>';
  return h;
}
function reportText(w){
  const c = walkCounts(w);
  const rows = reportRows(w);
  const L = [];
  L.push('DOOR LOCKS & KEYS — INVESTIGATION REPORT');
  L.push('Loews Hotels & Co — Security Systems Technology');
  L.push('');
  L.push('Property: ' + PROP_FULL[w.prop]);
  L.push('Date: ' + fmtDate(w.date));
  L.push('Time: ' + w.start + (w.end ? ' - ' + w.end : ''));
  L.push('Performed by: ' + w.by);
  L.push('Report #: ' + w.no);
  L.push('Scope: Physical check of door locks, gates and key points across the property. Each point was tested on site with its key.');
  L.push('');
  L.push('SUMMARY: ' + c.checked + ' checked - ' + c.ok + ' working - ' + c.bad + ' not working');
  L.push('');
  L.push('RESULTS (in the order walked):');
  rows.forEach(x => { L.push(x.n + '. ' + x.p.name + ' — ' + (x.r || 'Not checked') + (x.note ? ' (' + x.note + ')' : '')); });
  const bad = rows.filter(x => x.r === 'Not Working');
  if(bad.length){
    L.push('');
    L.push('FOLLOW-UP REQUIRED — NOT WORKING (' + bad.length + '):');
    bad.forEach(x => { L.push('- ' + x.p.name + (x.note ? ' (' + x.note + ')' : '')); });
  }
  L.push('');
  L.push('Reported by: ' + w.by + ' · Report ' + w.no);
  L.push('Produced by: JHNL Security Tech');
  return L.join('\n');
}
function printReport(wid){
  const w = walkById(wid); if(!w) return;
  const c = walkCounts(w);
  const rows = reportRows(w);
  const bad = rows.filter(x => x.r === 'Not Working');
  const th = 'style="border:1px solid #CBD5E0;padding:7px 9px;background:#1A365D;color:#fff;text-align:left;font-size:13px"';
  const td = 'style="border:1px solid #CBD5E0;padding:7px 9px;font-size:13px"';
  const stat = 'style="border:1px solid #CBD5E0;padding:10px;text-align:center;width:33%"';
  let h = '<div style="font-family:Arial,sans-serif;color:#1a202c;padding:10px;">'
    + '<div style="background:#1A365D;color:#fff;padding:14px 16px;border-bottom:4px solid #C9A227;"><img src="https://jeremylevinatwork-dev.github.io/secure-alert/loews-logo-trim.jpg" alt="Loews Hotels" style="height:32px;width:auto;background:#fff;border-radius:6px;padding:3px 6px"><div style="font-size:11.5px;letter-spacing:2px;color:#D4AF37;font-weight:bold;margin-top:8px;">LOEWS HOTELS &amp; CO — SECURITY SYSTEMS TECHNOLOGY</div><div style="font-size:22px;font-weight:bold;margin-top:3px;">Door Locks &amp; Keys — Investigation Report</div></div>'
    + '<table style="border-collapse:collapse;width:100%;margin-top:14px;">'
    + '<tr><td ' + td + '><b>Property</b></td><td ' + td + '>' + esc(PROP_FULL[w.prop]) + '</td><td ' + td + '><b>Date</b></td><td ' + td + '>' + esc(fmtDate(w.date)) + '</td></tr>'
    + '<tr><td ' + td + '><b>Time</b></td><td ' + td + '>' + esc(w.start) + (w.end ? ' – ' + esc(w.end) : '') + '</td><td ' + td + '><b>Performed by</b></td><td ' + td + '>' + esc(w.by) + '</td></tr>'
    + '<tr><td ' + td + '><b>Report #</b></td><td ' + td + '>' + esc(w.no) + '</td><td ' + td + '><b>Scope</b></td><td ' + td + '>Physical check of door locks, gates and key points. Each point tested on site with its key.</td></tr></table>'
    + '<table style="border-collapse:collapse;width:100%;margin-top:12px;"><tr>'
    + '<td ' + stat + '><div style="font-size:24px;font-weight:bold;color:#0F2440;">' + c.checked + '</div><div style="font-size:11px;font-weight:bold;letter-spacing:1px;color:#4A5568;">CHECKED</div></td>'
    + '<td ' + stat + '><div style="font-size:24px;font-weight:bold;color:#276749;">' + c.ok + '</div><div style="font-size:11px;font-weight:bold;letter-spacing:1px;color:#4A5568;">WORKING</div></td>'
    + '<td ' + stat + '><div style="font-size:24px;font-weight:bold;color:#B3261E;">' + c.bad + '</div><div style="font-size:11px;font-weight:bold;letter-spacing:1px;color:#4A5568;">NOT WORKING</div></td>'
    + '</tr></table>'
    + '<table style="border-collapse:collapse;width:100%;margin-top:14px;"><tr><th ' + th + '>#</th><th ' + th + '>Location / key point</th><th ' + th + '>Result</th><th ' + th + '>Notes</th></tr>'
    + rows.map((x, i) => '<tr' + (i % 2 ? ' style="background:#F7FAFC"' : '') + '><td ' + td + '>' + x.n + '</td><td ' + td + '><b>' + esc(x.p.name) + '</b></td><td ' + td + '>' + esc(x.r || 'Not checked') + '</td><td ' + td + '>' + esc(x.note) + '</td></tr>').join('') + '</table>';
  if(bad.length){
    h += '<h2 style="font-size:16px;margin:16px 0 6px;">Follow-up required — not working (' + bad.length + ')</h2><ul style="font-size:13.5px;margin:4px 0;">'
      + bad.map(x => '<li><b>' + esc(x.p.name) + '</b>' + (x.note ? ' — ' + esc(x.note) : '') + '</li>').join('') + '</ul>';
  }
  h += '<div style="margin-top:24px;font-size:13px;">Performed by: <b>' + esc(w.by) + '</b> &nbsp;&nbsp; Signature: ______________________ &nbsp;&nbsp; Date: ' + esc(fmtDateShort(w.date)) + '<br><br>Reviewed by: ______________________ &nbsp;&nbsp; Date: ______________</div>'
    + '<div style="margin-top:16px;color:#4A5568;font-size:12px;">Report ' + esc(w.no) + ' · Printed ' + esc(new Date().toLocaleString('en-US')) + ' by ' + esc(me) + '<br>Produced by: JHNL Security Tech</div></div>';
  document.getElementById('printArea').innerHTML = h;
  window.print();
}
async function emailReport(wid, btn){
  const w = walkById(wid); if(!w) return;
  const subj = 'Door Locks & Keys — Investigation Report: ' + PROP_FULL[w.prop] + ' (' + fmtDateShort(w.date) + ') [' + w.no + ']';
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ service_id: EJ_SERVICE, template_id: EJ_TEMPLATE, user_id: EJ_KEY, template_params: { subject: subj, body: reportText(w), to_email: MAIL_TO, name: 'Jeremy Levin', email: MAIL_TO } }) });
    if(!res.ok) throw new Error('send ' + res.status);
    toast('Report emailed to Jeremy');
  }catch(e){
    toast('Email failed — opening your mail app instead');
    location.href = 'mailto:' + MAIL_TO + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(reportText(w));
  }
  if(btn){ btn.disabled = false; btn.textContent = '✉ Email report'; }
}
</script>

<script>
let ssoUser = '';
function ssoName(){ if(ssoUser) return ssoUser; try{ return localStorage.getItem('loewsUser') || ''; }catch(e){ return ''; } }

function lockedOrLogin(){
  const sso = ssoName();
  if(sso && ALLOW.indexOf(sso) < 0){
    return '<div class="card" style="max-width:430px;margin:26px auto"><h2>🔑 Door Locks &amp; Keys</h2>'
      + '<p class="note">This section lives on the profiles of Jeremy Levin, Sean Forester and Justin Messenger only.</p></div>';
  }
  return '<div class="card" style="max-width:430px;margin:26px auto"><h2>🔑 Team login</h2>'
    + '<p class="note">Door Locks &amp; Keys investigations. This section is on the profiles of Jeremy Levin, Sean Forester and Justin Messenger.</p>'
    + '<label>Your name</label><select id="ky-name">' + ALLOW.map(n => '<option>' + n + '</option>').join('') + '</select>'
    + '<label>PIN</label><input type="password" id="ky-pin" inputmode="numeric" maxlength="4" placeholder="••••" onkeydown="if(event.key===\'Enter\') doLogin()">'
    + '<p class="err" id="ky-err"></p>'
    + '<button class="btn btn-navy" style="width:100%" onclick="doLogin()">Log in</button></div>';
}
async function doLogin(){
  const name = document.getElementById('ky-name').value;
  const pin = document.getElementById('ky-pin').value.trim();
  const err = document.getElementById('ky-err');
  err.textContent = '';
  try{
    const res = await fetch(SB_URL + '/rest/v1/app_records?id=eq.secure-alert-state&select=data', { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }, cache: 'no-store' });
    if(!res.ok) throw new Error('team load');
    const rows = await res.json();
    const team = (rows && rows[0] && rows[0].data && rows[0].data.team) || [];
    const hit = team.find(t => t.name === name && String(t.pin) === pin);
    if(!hit){ err.textContent = 'Name or PIN not recognized.'; return; }
    me = hit.name;
    try{ sessionStorage.setItem('keysName', me); }catch(e){}
    render();
  }catch(e){ err.textContent = 'Could not verify the PIN — check connection and try again.'; }
}

async function boot(){
  const main = document.getElementById('main');
  try{ S = await sbPull(); }catch(e){ S = null; }
  if(!S || !Array.isArray(S.points) || !Array.isArray(S.walks)){
    try{ const c = JSON.parse(localStorage.getItem('keys-cache') || 'null'); if(c && Array.isArray(c.points)) S = c; }catch(e){}
    if(!S || !Array.isArray(S.points) || !Array.isArray(S.walks)){ S = seedState(); sbPush(); }
  }
  const qm = /[?&]u=([^&]+)/.exec(location.search || '');
  if(qm){ const qu = decodeURIComponent(qm[1]); if(ALLOW.indexOf(qu) >= 0) ssoUser = qu; }
  ssoUser = ssoName();
  if(ssoUser && ALLOW.indexOf(ssoUser) >= 0) me = ssoUser;
  if(!me){ try{ const sn = sessionStorage.getItem('keysName'); if(sn && ALLOW.indexOf(sn) >= 0) me = sn; }catch(e){} }
  render();
  [0, 900, 2200, 4000].forEach(function(ms){ setTimeout(function(){ if(!me){ try{ window.parent.postMessage({ type: 'loews-sso-request' }, '*'); }catch(e){} } }, ms); });
  window.addEventListener('message', function(ev){
    if(!ev.data || ev.data.type !== 'loews-sso') return;
    ssoUser = ev.data.user || '';
    if(ssoUser && ALLOW.indexOf(ssoUser) >= 0){ me = ssoUser; }
    render();
  });
  setInterval(pollStamp, 30000);
}
boot();
</script>
